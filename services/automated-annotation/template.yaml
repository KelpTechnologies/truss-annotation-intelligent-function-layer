AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Automated annotation service using agent architecture for classification tasks. Supports vector-based model classification and LLM-based property classification via orchestration handlers."

Mappings:
  StageToDbStage:
    dev:
      DbStage: staging
    staging:
      DbStage: prod
    prod:
      DbStage: prod

Parameters:
  StageName:
    Type: String
    Default: dev
  FunctionName:
    Type: String
  ServiceName:
    Type: String
  CodeS3Bucket:
    Type: String
  CodeS3Key:
    Type: String
  DatabaseHost:
    Type: String
    Description: RDS Proxy endpoint
    Default: "undefined"
  DatabaseName:
    Type: String
    Default: "undefined"
  VpcId:
    Type: String
    Default: "vpc-04e79f1770f4205de"
  SubnetIds:
    Type: CommaDelimitedList
    Default: "subnet-0f14f1c73238b61ac,subnet-0fee2f00bb864b0f4,subnet-00c097a58a3d0bea2"

Resources:
  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "truss-ai-${ServiceName}-${StageName}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub "${FunctionName}-Policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - "arn:aws:secretsmanager:eu-west-2:193757560043:secret:truss-platform-secrets*"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub
                    - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-image-processing-${DbStage}"
                    - DbStage: !FindInMap [StageToDbStage, !Ref StageName, DbStage]
                  - !Sub
                    - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-image-processing-${DbStage}/index/*"
                    - DbStage: !FindInMap [StageToDbStage, !Ref StageName, DbStage]
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-image-processing-dev"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-image-processing-dev/index/*"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-image-processing-staging"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-image-processing-staging/index/*"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-image-processing-prod"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-image-processing-prod/index/*"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/model_visual_classifier_nodes"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/model_visual_classifier_nodes/index/*"
                  - !Sub
                    - "arn:aws:dynamodb:eu-west-2:193757560043:table/linesheet-upload-csv-configs-${DbStage}"
                    - DbStage: !FindInMap [StageToDbStage, !Ref StageName, DbStage]
                  - !Sub
                    - "arn:aws:dynamodb:eu-west-2:193757560043:table/linesheet-upload-csv-configs-${DbStage}/index/*"
                    - DbStage: !FindInMap [StageToDbStage, !Ref StageName, DbStage]
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/linesheet-upload-csv-configs-dev"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/linesheet-upload-csv-configs-dev/index/*"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/linesheet-upload-csv-configs-staging"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/linesheet-upload-csv-configs-staging/index/*"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/linesheet-upload-csv-configs-prod"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/linesheet-upload-csv-configs-prod/index/*"
                  - !Sub
                    - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-configs-${DbStage}"
                    - DbStage: !FindInMap [StageToDbStage, !Ref StageName, DbStage]
                  - !Sub
                    - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-configs-${DbStage}/index/*"
                    - DbStage: !FindInMap [StageToDbStage, !Ref StageName, DbStage]
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-configs-dev"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-configs-dev/index/*"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-configs-staging"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-configs-staging/index/*"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-configs-prod"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-configs-prod/index/*"
                  - !Sub
                    - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-schemas-${DbStage}"
                    - DbStage: !FindInMap [StageToDbStage, !Ref StageName, DbStage]
                  - !Sub
                    - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-schemas-${DbStage}/index/*"
                    - DbStage: !FindInMap [StageToDbStage, !Ref StageName, DbStage]
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-schemas-dev"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-schemas-dev/index/*"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-schemas-staging"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-schemas-staging/index/*"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-schemas-prod"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-schemas-prod/index/*"
                  - !Sub
                    - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-prompt-templates-${DbStage}"
                    - DbStage: !FindInMap [StageToDbStage, !Ref StageName, DbStage]
                  - !Sub
                    - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-prompt-templates-${DbStage}/index/*"
                    - DbStage: !FindInMap [StageToDbStage, !Ref StageName, DbStage]
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-prompt-templates-dev"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-prompt-templates-dev/index/*"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-prompt-templates-staging"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-prompt-templates-staging/index/*"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-prompt-templates-prod"
                  - "arn:aws:dynamodb:eu-west-2:193757560043:table/truss-agent-prompt-templates-prod/index/*"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - "arn:aws:lambda:eu-west-2:193757560043:function:truss-annotation-data-service-*"
                  - "arn:aws:lambda:eu-west-2:193757560043:function:truss-data-service-*"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

  # Stack-owned egress-only security group: the Lambda sits in private subnets whose
  # route table sends 0.0.0.0/0 through the VPC NAT gateway, so every outbound call
  # leaves from the NAT's Elastic IP, the one address the Azure firewall allow-lists.
  LambdaEgressSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${FunctionName} egress-only (NAT to Azure Postgres / GCP / Pinecone)"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: all egress; reachability is decided by the subnet route (NAT)
      Tags:
        - Key: Name
          Value: !Sub "${FunctionName}-egress"

  # Admit this Lambda's egress SG on interface endpoint SG sg-06efcbcde6530a742 (HTTPS only).
  EndpointIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: "sg-06efcbcde6530a742"
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaEgressSecurityGroup
      Description: !Sub "${FunctionName} HTTPS to interface endpoint (Secrets Manager)"

  ServiceLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Handler: index.lambda_handler
      Runtime: python3.11
      Role: !GetAtt ServiceRole.Arn
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Timeout: 300
      MemorySize: 1024
      Layers:
        - "arn:aws:lambda:eu-west-2:193757560043:layer:intelligent-functions-python-CORE:3"
        - "arn:aws:lambda:eu-west-2:193757560043:layer:intelligent-functions-python-ML:4"
        - "arn:aws:lambda:eu-west-2:193757560043:layer:intelligent-functions-python-DATA:3"
      TracingConfig:
        Mode: Active
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaEgressSecurityGroup
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          STAGE: !Ref StageName
          DB_STAGE: !FindInMap [StageToDbStage, !Ref StageName, DbStage]
          SERVICE_NAME: "automated-annotation"
          LAYER_NAME: "aifl"
          TRUSS_SECRETS_ARN: "arn:aws:secretsmanager:eu-west-2:193757560043:secret:truss-platform-secrets-yVuz1R"
          VERTEXAI_PROJECT: "truss-data-science"
          AZURE_PG_PORT: "6432"
          AZURE_PG_SECRET_KEY: "azure_database_aifl"
          DB_HOST: !Ref DatabaseHost

  ServiceLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ServiceLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/*/*"

Outputs:
  FunctionArn:
    Description: "ARN of the automated-annotation Service Lambda"
    Value: !GetAtt ServiceLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FunctionArn"

  FunctionName:
    Description: "Name of the automated-annotation Service Lambda"
    Value: !Ref ServiceLambda
    Export:
      Name: !Sub "${AWS::StackName}-FunctionName"
