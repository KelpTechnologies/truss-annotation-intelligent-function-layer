AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Image processing Lambda function and DynamoDB table"

Parameters:
  StageName:
    Type: String
    Default: dev
    Description: "Data namespace the resizer operates in (DB_STAGE = staging or prod). The deploy workflow passes the DB_STAGE-mapped value, not the raw deployment stage."
  FunctionName:
    Type: String
    Description: Name of the image processing Lambda function
  CodeS3Bucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment package
  CodeS3Key:
    Type: String
    Description: S3 key of the Lambda deployment package
  SourceBucketName:
    Type: String
    Description: Name of the existing source S3 bucket
  ProcessedBucketName:
    Type: String
    Description: Name of the existing processed S3 bucket
  ProcessingTableName:
    Type: String
    Description: Name of the DynamoDB processing table (may differ from stage due to DB_STAGE mapping)
  VectorizationApiUrl:
    Type: String
    Default: "https://truss-vec-cpu.swedencentral.cloudapp.azure.com/vectorize"
    Description: "URL of the image vectorization API endpoint. The deploy workflow passes this explicitly — CloudFormation reuses the STORED parameter value for anything not passed, so this default alone will not correct a drifted stack."
  VectorizationApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "API key for vectorization API authentication. Supplied by the deploy workflow from the VECTORIZATION_API_KEY repo secret; the Azure endpoint 401s without it."
  ReservedConcurrency:
    Type: Number
    Default: 5
    Description: "Max concurrent executions. The vectorizer is a single CPU box: measured goodput is ~3.1 img/s at concurrency 4 (p95 1.4s), and it suffers congestion collapse under load — a 210-concurrent burst on 2026-08-11 managed only 2.25 img/s and timed out 58% of requests. Concurrency is capped rather than raising the timeout. S3 invokes this asynchronously, so throttled events wait in the invocation queue and retry within the maximum event age instead of being dropped."

Resources:
  # IAM Role for Lambda function
  ImageProcessingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "truss-image-processing-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub "arn:aws:s3:::${SourceBucketName}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource:
                  - !Sub "arn:aws:s3:::${ProcessedBucketName}/*"
        - PolicyName: DynamoDBAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProcessingTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProcessingTableName}/index/*"

  # Lambda function for image processing
  ImageProcessingLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Handler: index.handler
      Runtime: nodejs22.x
      Role: !GetAtt ImageProcessingRole.Arn
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Timeout: 300
      MemorySize: 1024
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          STAGE: !Ref StageName
          SOURCE_BUCKET: !Ref SourceBucketName
          PROCESSED_BUCKET: !Ref ProcessedBucketName
          PROCESSING_TABLE: !Ref ProcessingTableName
          VECTORIZATION_API_URL: !Ref VectorizationApiUrl
          VECTORIZATION_API_KEY: !Ref VectorizationApiKey
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:truss-toolkit-nodejs-layer:194"

  # Lambda permission for S3 to invoke the function
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ImageProcessingLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${SourceBucketName}"

Outputs:
  ProcessingTableName:
    Description: "Name of the processing status DynamoDB table"
    Value: !Ref ProcessingTableName
    Export:
      Name: !Sub "${AWS::StackName}-ProcessingTableName"

  LambdaFunctionArn:
    Description: "ARN of the image processing Lambda function"
    Value: !GetAtt ImageProcessingLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LambdaFunctionArn"

  LambdaFunctionName:
    Description: "Name of the image processing Lambda function"
    Value: !Ref ImageProcessingLambda
    Export:
      Name: !Sub "${AWS::StackName}-LambdaFunctionName"
